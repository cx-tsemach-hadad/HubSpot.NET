name: build-and-test
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # Test projects target netcoreapp2.x (not installable on ubuntu-latest); roll forward to the .NET 9 runtime.
      DOTNET_ROLL_FORWARD: Major
      NuGetAudit: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      # Build only the test project (and the library it references). The solution also has
      # HubSpot.NET.Examples, which targets .NET Framework 4.6.1 and can't build on Linux.
      - run: dotnet build HubSpot.NET.Tests
      - run: dotnet test HubSpot.NET.Tests --no-build
